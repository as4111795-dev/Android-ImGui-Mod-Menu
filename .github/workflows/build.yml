name: Build Android SO
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK
        run: |
          cd /tmp
          wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q android-ndk-r27c-linux.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-r27c" >> $GITHUB_ENV
      - name: Build SO
        run: |
          export ANDROID_NDK_HOME=/tmp/android-ndk-r27c
          find . -name "*.cpp" | head -n 20
          SRC=$(find . -name "native.cpp" | head -n 1)
          echo "Found: $SRC"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ --target=aarch64-linux-android21 -shared -fPIC $SRC -o libnative_test.so
          ls -lh libnative_test.so
      - name: Upload SO
        uses: actions/upload-artifact@v4
        with:
          name: android-so
          path: libnative_test.so
