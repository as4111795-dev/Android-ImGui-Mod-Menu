      - name: Build SO
        run: |
          export ANDROID_NDK_HOME=/tmp/android-ndk-r27c
          find . -name "*.cpp" | head -n 20
          SRC=$(find . -name "native.cpp" | head -n 1)
          echo "Found: $SRC"
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++ --target=aarch64-linux-android21 -shared -fPIC $SRC -o libnative_test.so
          ls -lh libnative_test.so
